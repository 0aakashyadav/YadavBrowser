<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YadavBrowser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #202124;
      color: white;
      overflow: hidden;
    }

    .toolbar {
      height: 70px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #292a2d;
    }

    button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 8px;
      background: #3c4043;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #55585c;
    }

    #address {
      flex: 1;
      height: 42px;
      padding: 0 16px;
      border: none;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
      background: #f1f3f4;
      color: #202124;
    }

    .logo {
      font-weight: bold;
      font-size: 18px;
      margin-right: 5px;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <div class="logo">YB</div>

    <button onclick="goBack()" title="Back">←</button>
    <button onclick="goForward()" title="Forward">→</button>
    <button onclick="reloadPage()" title="Reload">⟳</button>

    <input
      id="address"
      type="text"
      placeholder="Search or enter website"
      autocomplete="off"
      onkeydown="handleAddress(event)"
    >
  </div>

  <script>
    function handleAddress(event) {
      if (event.key !== "Enter") return;

      const input = document.getElementById("address").value.trim();

      if (!input) return;

      let url = input;

      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        if (url.includes(".") && !url.includes(" ")) {
          url = "https://" + url;
        } else {
          url =
            "https://www.google.com/search?q=" +
            encodeURIComponent(url);
        }
      }

      window.browserAPI.navigate(url);
    }

    function goBack() {
      window.browserAPI.back();
    }

    function goForward() {
      window.browserAPI.forward();
    }

    function reloadPage() {
      window.browserAPI.reload();
    }
  </script>

</body>
</html>
