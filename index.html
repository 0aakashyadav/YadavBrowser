<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YadavBrowser</title>

  <style>

    /* =========================
       GLOBAL
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      background: #202124;
      color: white;
    }


    /* =========================
       TAB BAR
    ========================= */

    .tabs {
      height: 38px;

      width: 100%;

      display: flex;
      align-items: center;

      background: #202124;

      padding: 3px 8px 3px 8px;

      gap: 4px;

      overflow-x: auto;
      overflow-y: hidden;

      white-space: nowrap;
    }


    .tabs::-webkit-scrollbar {
      height: 4px;
    }


    .tabs::-webkit-scrollbar-track {
      background: #202124;
    }


    .tabs::-webkit-scrollbar-thumb {
      background: #55585c;
      border-radius: 10px;
    }


    /* =========================
       TAB
    ========================= */

    .tab {
      height: 32px;

      min-width: 150px;
      max-width: 220px;

      flex-shrink: 0;

      padding: 0 8px 0 12px;

      display: flex;
      align-items: center;

      background: #292a2d;

      border-radius: 8px 8px 0 0;

      cursor: pointer;

      font-size: 13px;

      user-select: none;

      transition:
        background 0.15s ease;
    }


    .tab:hover {
      background: #35363a;
    }


    .tab.active {
      background: #3c4043;
    }


    /* =========================
       TAB TITLE
    ========================= */

    .tab-title {
      flex: 1;

      min-width: 0;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    /* =========================
       CLOSE TAB
    ========================= */

    .close-tab {
      width: 24px;
      height: 24px;

      flex-shrink: 0;

      margin-left: 6px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      font-size: 17px;

      cursor: pointer;

      color: #ddd;
    }


    .close-tab:hover {
      background: #55585c;

      color: white;
    }


    /* =========================
       NEW TAB BUTTON
    ========================= */

    #newTab {
      width: 32px;
      height: 32px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;

      border-radius: 8px;

      background: transparent;

      color: white;

      font-size: 23px;

      line-height: 1;

      cursor: pointer;

      user-select: none;
    }


    #newTab:hover {
      background: #3c4043;
    }


    #newTab:active {
      background: #55585c;
    }


    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      width: 100%;

      height: 70px;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 10px;

      background: #292a2d;
    }


    /* =========================
       LOGO
    ========================= */

   .logo {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

.logo img {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 50%;
}


    /* =========================
       TOOLBAR BUTTONS
    ========================= */

    .toolbar button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: none;

      border-radius: 8px;

      background: #3c4043;

      color: white;

      font-size: 20px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .toolbar button:hover {
      background: #55585c;
    }


    .toolbar button:active {
      background: #686b70;
    }


    /* =========================
       ADDRESS BAR
    ========================= */

    #address {
      flex: 1;

      min-width: 100px;

      height: 42px;

      padding: 0 18px;

      border: none;

      border-radius: 22px;

      outline: none;

      font-size: 15px;

      background: #f1f3f4;

      color: #202124;
    }


    #address:focus {
      box-shadow:
        0 0 0 2px #8ab4f8;
    }


    #address::placeholder {
      color: #666;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .tab {
        min-width: 120px;
        max-width: 180px;
      }

      .logo {
        display: none;
      }

      .toolbar {
        gap: 5px;
        padding: 8px;
      }

      .toolbar button {
        width: 38px;
        height: 38px;
      }

      #address {
        height: 38px;
        font-size: 14px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       TAB BAR
  ====================================================== -->

  <div
    class="tabs"
    id="tabs"
  >

    <!-- Tabs are inserted here by JavaScript -->

    <button
      id="newTab"
      title="New Tab"
      aria-label="New Tab"
    >
      +
    </button>

  </div>


  <!-- =====================================================
       TOOLBAR
  ====================================================== -->

  <div class="toolbar">

    <!-- Logo -->

   <div class="logo">
  <img src="logo.png" alt="YadavBrowser">
</div>


    <!-- Back -->

    <button
      id="back"
      title="Back"
      aria-label="Back"
    >
      ←
    </button>


    <!-- Forward -->

    <button
      id="forward"
      title="Forward"
      aria-label="Forward"
    >
      →
    </button>


    <!-- Reload -->

    <button
      id="reload"
      title="Reload"
      aria-label="Reload"
    >
      ⟳
    </button>


    <!-- Address -->

    <input
      id="address"
      type="text"
      placeholder="Search or enter website"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    >

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const tabsContainer =
      document.getElementById("tabs");

    const newTabButton =
      document.getElementById("newTab");

    const address =
      document.getElementById("address");

    const backButton =
      document.getElementById("back");

    const forwardButton =
      document.getElementById("forward");

    const reloadButton =
      document.getElementById("reload");


    /* =====================================================
       ADDRESS BAR
    ====================================================== */

    function handleAddress(event) {

      if (event.key !== "Enter") {
        return;
      }


      const input =
        address.value.trim();


      if (!input) {
        return;
      }


      let url = input;


      /*
       * Already a URL
       */

      if (
        url.startsWith("http://") ||
        url.startsWith("https://")
      ) {

        // Keep URL unchanged

      }


      /*
       * Website such as:
       * google.com
       * youtube.com
       */

      else if (
        url.includes(".") &&
        !url.includes(" ")
      ) {

        url =
          "https://" + url;

      }


      /*
       * Everything else becomes
       * a Google search
       */

      else {

        url =
          "https://www.google.com/search?q=" +
          encodeURIComponent(url);

      }


      window.browserAPI.navigate(url);

    }


    /* =====================================================
       BACK
    ====================================================== */

    function goBack() {

      window.browserAPI.back();

    }


    /* =====================================================
       FORWARD
    ====================================================== */

    function goForward() {

      window.browserAPI.forward();

    }


    /* =====================================================
       RELOAD
    ====================================================== */

    function reloadPage() {

      window.browserAPI.reload();

    }


    /* =====================================================
       NEW TAB
    ====================================================== */

    newTabButton.addEventListener(
      "click",
      () => {

        window.browserAPI.newTab();

      }
    );


    /* =====================================================
       BACK BUTTON
    ====================================================== */

    backButton.addEventListener(
      "click",
      goBack
    );


    /* =====================================================
       FORWARD BUTTON
    ====================================================== */

    forwardButton.addEventListener(
      "click",
      goForward
    );


    /* =====================================================
       RELOAD BUTTON
    ====================================================== */

    reloadButton.addEventListener(
      "click",
      reloadPage
    );


    /* =====================================================
       ADDRESS ENTER
    ====================================================== */

    address.addEventListener(
      "keydown",
      handleAddress
    );


    /* =====================================================
       TAB UPDATE
    ====================================================== */

    window.browserAPI.onTabUpdate(
      (data) => {

        /*
         * Remove old tabs.
         *
         * IMPORTANT:
         * Don't remove the + button.
         */

        const oldTabs =
          tabsContainer.querySelectorAll(".tab");


        oldTabs.forEach(
          (tab) => tab.remove()
        );


        /*
         * Create tabs again
         */

        data.tabs.forEach(
          (tab, index) => {

            const tabElement =
              document.createElement("div");


            tabElement.className =
              "tab";


            /*
             * Active tab
             */

            if (
              index === data.activeIndex
            ) {

              tabElement.classList.add(
                "active"
              );

            }


            /* =========================
               TAB TITLE
            ========================= */

            const title =
              document.createElement("span");


            title.className =
              "tab-title";


            title.textContent =
              tab.title || "New Tab";


            title.title =
              tab.title || "New Tab";


            /* =========================
               CLOSE BUTTON
            ========================= */

            const close =
              document.createElement("span");


            close.className =
              "close-tab";


            close.textContent =
              "×";


            close.title =
              "Close tab";


            /*
             * Close tab
             */

            close.addEventListener(
              "click",
              (event) => {

                event.stopPropagation();

                window.browserAPI.closeTab();

              }
            );


            /* =========================
               CLICK TAB
            ========================= */

            tabElement.addEventListener(
              "click",
              () => {

                window.browserAPI.switchTab(
                  index
                );

              }
            );


            /* =========================
               ADD CONTENT
            ========================= */

            tabElement.appendChild(
              title
            );

            tabElement.appendChild(
              close
            );


            /*
             * Insert BEFORE + button
             */

            tabsContainer.insertBefore(
              tabElement,
              newTabButton
            );

          }
        );


        /*
         * Keep active tab visible
         */

        const activeElement =
          tabsContainer.querySelector(
            ".tab.active"
          );


        if (activeElement) {

          activeElement.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "nearest"
          });

        }

      }
    );


    /* =====================================================
       ADDRESS UPDATE
    ====================================================== */

    window.browserAPI.onAddressUpdate(
      (url) => {

        address.value =
          url || "";

      }
    );


    /* =====================================================
       ADDRESS SELECT ON FOCUS
    ====================================================== */

    address.addEventListener(
      "focus",
      () => {

        address.select();

      }
    );
window.browserAPI.onFocusAddressBar(
  () => {
    address.focus();
    address.select();
  }
);

  </script>

</body>

</html>
