<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Yadav Search</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101827;--panel2:#162238;--text:#f7f9fc;--muted:#94a3b8;--line:#25344c;--accent:#4f8cff;--accent2:#22d3ee;--danger:#fb7185;--ok:#34d399}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 10% 0,#15366d 0,transparent 28%),radial-gradient(circle at 90% 90%,#063b49 0,transparent 25%),var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.top{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,12,25,.8);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}.brand small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:2px}.top-actions{display:flex;gap:8px}.top button,.linkbtn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:18px;padding:8px 13px}.top button:hover,.linkbtn:hover{background:rgba(255,255,255,.1)}
main{width:min(1100px,calc(100% - 30px));margin:auto;padding:42px 0 60px}.hero{text-align:center;transition:.25s}.hero.compact{text-align:left}.hero.compact .hero-logo,.hero.compact .tag{display:none}.hero-logo{width:78px;height:78px;border-radius:50%;object-fit:cover;box-shadow:0 18px 60px rgba(37,99,235,.3)}h1{font-size:clamp(38px,7vw,62px);margin:14px 0 7px;letter-spacing:-2px}.accent{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}.tag{color:var(--muted);margin:0 0 25px}.search{height:60px;width:min(800px,100%);margin:auto;display:flex;align-items:center;padding:5px;border:1px solid #34445d;border-radius:31px;background:rgba(255,255,255,.08);box-shadow:0 18px 55px rgba(0,0,0,.28);position:relative}.compact .search{margin:0}.search:focus-within{border-color:#4f9cff;box-shadow:0 0 0 3px rgba(59,130,246,.15),0 18px 55px rgba(0,0,0,.28)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:16px;padding:0 18px}.search button{width:50px;height:50px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:20px}.suggestions{position:absolute;top:64px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:none;text-align:left;z-index:30;box-shadow:0 20px 50px rgba(0,0,0,.4)}.suggestions.show{display:block}.suggestion{padding:11px 16px}.suggestion:hover{background:var(--panel2)}
.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.compact~.modes{justify-content:flex-start}.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:18px;padding:7px 13px}.chip.active{background:rgba(59,130,246,.2);border-color:#3b82f6}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 24px}.tool{border:0;background:none;color:var(--muted);font-size:12px}.tool:hover{color:#fff}
.status{display:none;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);margin:18px 0;color:var(--muted);font-size:13px}.status.show{display:block}.status.error{border-color:rgba(251,113,133,.4);color:#fecdd3}.status.ok{border-color:rgba(52,211,153,.3);color:#a7f3d0}.results-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-top:20px}.results-meta{font-size:12px;color:var(--muted);margin:0 0 12px}.result{padding:17px 0;border-bottom:1px solid rgba(255,255,255,.08)}.result-url{font-size:12px;color:#67e8f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-title{display:block;color:#8ab4ff;font-size:19px;margin:5px 0;text-decoration:none}.result-title:hover{text-decoration:underline}.result-snippet{color:#b8c4d6;font-size:13px;line-height:1.55;margin:0}.result-info{display:flex;gap:8px;margin-top:8px;color:#64748b;font-size:10px}.result-actions{float:right;display:flex;gap:5px}.result-actions button{border:1px solid var(--line);background:transparent;color:#94a3b8;border-radius:12px;padding:3px 8px;font-size:10px}.side{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);padding:16px;height:max-content;position:sticky;top:84px}.side h3{font-size:14px;margin:0 0 12px}.answer{font-size:13px;line-height:1.5;color:#dbeafe;margin-bottom:14px}.suggest-list{display:flex;flex-wrap:wrap;gap:7px}.suggest-list button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cbd5e1;border-radius:12px;padding:7px 9px;font-size:11px}.pagination{display:flex;justify-content:center;gap:8px;margin:25px 0}.pagination button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:9px;padding:8px 14px}.empty{text-align:center;padding:55px 15px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.recent{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.recent span{padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;cursor:pointer}.home-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px}.card{padding:18px 10px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.045);cursor:pointer;text-align:center;transition:.18s}.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.08)}.ico{font-size:24px;margin-bottom:8px}.card strong{font-size:13px}.card span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.footer{text-align:center;color:#64748b;font-size:11px;padding:30px}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #64748b;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.results-layout{grid-template-columns:1fr}.side{position:static}.home-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{padding:0 12px}.top-actions button:last-child{display:none}main{width:min(100% - 20px,1100px);padding-top:30px}.result-title{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="logo.png" alt="YadavBrowser"><div>Yadav Search<small>Search • Discover • Navigate</small></div></div><div class="top-actions"><button onclick="openYB()">YB</button><button onclick="goHome()">Home</button></div></header>
<main>
<section class="hero" id="hero"><img class="hero-logo" src="logo.png" alt="Yadav Search"><h1>Yadav <span class="accent">Search</span></h1><p class="tag">Fast, focused web search built for YadavBrowser.</p>
<form class="search" id="form"><input id="q" autocomplete="off" autofocus placeholder="Search the web or enter a website"><button aria-label="Search">⌕</button><div class="suggestions" id="suggestions"></div></form>
<nav class="modes"><button class="chip active" data-mode="web">🌐 Web</button><button class="chip" data-mode="news">📰 News</button><button class="chip" data-mode="images">🖼️ Images</button><button class="chip" data-mode="videos">🎬 Videos</button></nav>
<div class="tools"><button class="tool" onclick="toggleSafe()">Safe Search: <b id="safeLabel">Moderate</b></button><button class="tool" onclick="setTime('')">Any time</button><button class="tool" onclick="setTime('day')">Past day</button><button class="tool" onclick="setTime('month')">Past month</button><button class="tool" onclick="setTime('year')">Past year</button></div></section>
<div class="status" id="status"></div>
<section id="home"><div class="home-cards"><div class="card" onclick="quick('latest news','news')"><div class="ico">📰</div><strong>News</strong><span>Current stories</span></div><div class="card" onclick="quick('','web')"><div class="ico">🌐</div><strong>Web</strong><span>Search the web</span></div><div class="card" onclick="quick('YouTube','videos')"><div class="ico">▶️</div><strong>Videos</strong><span>Find videos</span></div><div class="card" onclick="quick('images','images')"><div class="ico">🖼️</div><strong>Images</strong><span>Find images</span></div><div class="card" onclick="openChess()"><div class="ico">♟️</div><strong>Chess</strong><span>Open your game</span></div></div><div id="recentBox"><h3 style="font-size:14px;margin:28px 0 8px">Recent searches <button class="tool" onclick="clearRecent()">Clear</button></h3><div class="recent" id="recent"></div></div></section>
<section id="results" style="display:none"><div class="results-layout"><div><div class="results-meta" id="meta"></div><div id="resultList"></div><div class="pagination"><button onclick="page(-1)">← Previous</button><button onclick="page(1)">Next →</button></div></div><aside class="side" id="side"></aside></div></section>
</main><div class="footer">© 2026 YadavBrowser · Yadav Search</div>
<script>
const q=document.getElementById('q'),form=document.getElementById('form'),suggestions=document.getElementById('suggestions'),hero=document.getElementById('hero'),home=document.getElementById('home'),results=document.getElementById('results'),list=document.getElementById('resultList'),meta=document.getElementById('meta'),side=document.getElementById('side'),statusBox=document.getElementById('status');
let mode='web',pageNo=1,timeRange='',safeSearch=1,lastQuery='';
const providerFallback={web:'https://www.google.com/search?q=',news:'https://www.google.com/search?tbm=nws&q=',images:'https://www.google.com/search?tbm=isch&q=',videos:'https://www.google.com/search?tbm=vid&q='};
function nav(url){if(window.browserAPI?.navigate)window.browserAPI.navigate(url);else location.href=url}
function directUrl(value){return /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(value)||(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(value)&&!value.includes(' '))}
function setStatus(text,type=''){statusBox.textContent=text;statusBox.className='status show '+type}
function clearStatus(){statusBox.className='status'}
function setMode(m){mode=m;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.mode===m))}
function setTime(t){timeRange=t;if(lastQuery)runSearch(lastQuery,true)}
function toggleSafe(){safeSearch=safeSearch===1?2:safeSearch===2?0:1;document.getElementById('safeLabel').textContent=safeSearch===2?'Strict':safeSearch===0?'Off':'Moderate';if(lastQuery)runSearch(lastQuery,true)}
async function runSearch(value,keepPage=false){value=String(value||'').trim();if(!value){q.focus();return}if(directUrl(value)){nav(value);return}if(!keepPage)pageNo=1;lastQuery=value;q.value=value;saveRecent(value);hero.classList.add('compact');home.style.display='none';results.style.display='block';clearStatus();list.innerHTML='<div class="empty"><span class="spinner"></span>Searching…</div>';meta.textContent='';side.innerHTML='';
  if(!window.browserAPI?.searchWeb){fallback(value);return}
  try{const data=await window.browserAPI.searchWeb({q:value,mode,page:pageNo,timeRange,safeSearch});if(!data.enabled){setStatus('Yadav Search backend is not configured yet. Set YADAV_SEARCH_URL to a SearXNG endpoint with JSON search enabled. You can still use the provider fallback below.','error');fallback(value,true);return}render(data)}catch(error){setStatus('Search failed: '+(error?.message||error),'error');fallback(value,true)}}
function fallback(value,keep=true){const url=(providerFallback[mode]||providerFallback.web)+encodeURIComponent(value);list.innerHTML='<div class="empty"><strong>Yadav Search provider is unavailable.</strong><br><br>Use the external provider fallback to continue searching.<br><br><button class="linkbtn" onclick="nav('+JSON.stringify(url)+')">Search externally →</button></div>';meta.textContent='';side.innerHTML='<h3>Provider setup</h3><div class="answer">Yadav Search is designed as a metasearch layer. Connect a SearXNG instance to YADAV_SEARCH_URL for aggregated results, categories, pagination and suggestions.</div>'}
function render(data){clearStatus();const items=data.results||[];meta.textContent=(data.numberOfResults?data.numberOfResults.toLocaleString()+' results':'Results')+' · page '+pageNo;list.innerHTML='';if(!items.length){list.innerHTML='<div class="empty">No results found. Try different words or a broader query.</div>'}items.forEach(item=>{const row=document.createElement('article');row.className='result';const safeTitle=escapeHtml(item.title);row.innerHTML='<div class="result-url">'+escapeHtml(item.url)+'</div><a class="result-title" href="#">'+safeTitle+'</a><p class="result-snippet">'+escapeHtml(item.content||'No description available.')+'</p><div class="result-info"><span>'+escapeHtml(item.engine||'web')+'</span>'+(item.publishedDate?'<span>· '+escapeHtml(String(item.publishedDate))+'</span>':'')+'<span style="margin-left:auto"><button class="linkbtn" data-open="1">Open</button><button class="linkbtn" data-tab="1">New tab</button></span></div>';row.querySelector('.result-title').onclick=e=>{e.preventDefault();nav(item.url)};row.querySelector('[data-open]').onclick=()=>nav(item.url);row.querySelector('[data-tab]').onclick=()=>window.browserAPI?.openNewTab?window.browserAPI.openNewTab(item.url):nav(item.url);list.appendChild(row)};side.innerHTML='';if(data.answers?.length){const h=document.createElement('div');h.innerHTML='<h3>Quick answers</h3>';data.answers.forEach(a=>{const p=document.createElement('div');p.className='answer';p.textContent=typeof a==='string'?a:(a.answer||a.text||'');h.appendChild(p)});side.appendChild(h)}if(data.suggestions?.length){const h=document.createElement('div');h.innerHTML='<h3>Related searches</h3>';const box=document.createElement('div');box.className='suggest-list';data.suggestions.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>runSearch(s);box.appendChild(b)});h.appendChild(box);side.appendChild(h)}if(!side.children.length)side.innerHTML='<h3>Yadav Search</h3><div class="answer">Results are aggregated through your configured search provider. Yadav Search does not need to own a copy of the entire web to provide the search experience.</div>'}
function page(delta){if(!lastQuery)return;pageNo=Math.max(1,pageNo+delta);runSearch(lastQuery,true)}
form.addEventListener('submit',e=>{e.preventDefault();runSearch(q.value)});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function quick(value,m){setMode(m);q.value=value;if(value)runSearch(value);else q.focus()}
function saveRecent(v){let a=JSON.parse(localStorage.getItem('yadav-search-recent')||'[]').filter(x=>x!==v);a.unshift(v);localStorage.setItem('yadav-search-recent',JSON.stringify(a.slice(0,12)));renderRecent()}
function renderRecent(){const box=document.getElementById('recent'),a=JSON.parse(localStorage.getItem('yadav-search-recent')||'[]');box.innerHTML='';a.forEach(x=>{const s=document.createElement('span');s.textContent=x;s.onclick=()=>runSearch(x);box.appendChild(s)})}
function clearRecent(){localStorage.removeItem('yadav-search-recent');renderRecent()}
function openYB(){if(window.browserAPI?.openNewTab)window.browserAPI.openNewTab('file://'+location.pathname.split('/').slice(0,-1).join('/')+'/yadav-search.html');else goHome()}
function goHome(){lastQuery='';pageNo=1;hero.classList.remove('compact');home.style.display='block';results.style.display='none';clearStatus();q.value='';q.focus()}
function openChess(){if(window.browserAPI?.openNewTab)window.browserAPI.openNewTab('https://www.google.com/search?q=YadavBrowser+Chess');else runSearch('YadavBrowser Chess')}
let suggestionTimer;q.addEventListener('input',()=>{clearTimeout(suggestionTimer);const value=q.value.trim();if(!value){suggestions.classList.remove('show');return}suggestionTimer=setTimeout(async()=>{if(window.browserAPI?.searchWeb){try{const d=await window.browserAPI.searchWeb({q:value,mode,page:1,safeSearch});if(d.suggestions?.length){suggestions.innerHTML=d.suggestions.slice(0,8).map(x=>'<div class="suggestion">⌕ '+escapeHtml(x)+'</div>').join('');suggestions.classList.add('show');suggestions.querySelectorAll('.suggestion').forEach((el,i)=>el.onclick=()=>{q.value=d.suggestions[i];suggestions.classList.remove('show');runSearch(d.suggestions[i])});return}}catch{}}suggestions.innerHTML='<div class="suggestion">⌕ '+escapeHtml(value)+'</div>';suggestions.classList.add('show');suggestions.firstChild.onclick=()=>{suggestions.classList.remove('show');runSearch(value)}},160)});document.addEventListener('click',e=>{if(e.target!==q&&!suggestions.contains(e.target))suggestions.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')suggestions.classList.remove('show');if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();q.focus()}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();goHome()}});function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}renderRecent();
</script>
</body>
</html>
