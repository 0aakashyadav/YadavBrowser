name: Build YadavBrowser

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows application
        run: npm run build

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: YadavBrowser-Windows
          path: |
            dist/*.exe
            dist/*.blockmap