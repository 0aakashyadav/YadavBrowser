<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YadavBrowser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#202124;color:#fff}.tabs{height:38px;display:flex;gap:4px;align-items:center;padding:3px 8px;background:#202124;overflow:auto}.tab{height:32px;min-width:150px;max-width:230px;display:flex;align-items:center;padding:0 7px 0 12px;background:#292a2d;border-radius:8px 8px 0 0;cursor:pointer;user-select:none}.tab.active{background:#3c4043}.tab.private{background:#382b45}.tab.private.active{background:#503965}.tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.tab-close{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:17px}.tab-close:hover{background:#555}.new{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:23px}.new:hover{background:#3c4043}.toolbar{height:70px;display:flex;gap:7px;align-items:center;padding:10px;background:#292a2d}.logo{width:42px;height:42px;border-radius:50%;object-fit:cover}.tool{width:42px;height:42px;border:0;border-radius:9px;background:#3c4043;color:#fff;font-size:18px;cursor:pointer}.tool:hover{background:#555}.address{flex:1;height:42px;border:0;outline:0;border-radius:22px;background:#f1f3f4;color:#202124;padding:0 18px;font-size:15px}.address:focus{box-shadow:0 0 0 2px #8ab4f8}.private-label{display:none;padding:4px 12px;background:#49365a;color:#eadcff;font-size:11px;text-align:center}.panel{position:fixed;top:108px;right:12px;width:390px;max-height:calc(100vh - 125px);overflow:auto;background:#292a2d;border:1px solid #4a4c50;border-radius:14px;box-shadow:0 15px 45px #0008;z-index:10000;display:none}.panel.open{display:block}.panel-head{position:sticky;top:0;display:flex;justify-content:space-between;padding:14px 16px;background:#292a2d;border-bottom:1px solid #444}.panel-head button{border:0;background:transparent;color:#fff;font-size:20px}.panel-actions{padding:10px 14px;border-bottom:1px solid #3d3f42}.panel-actions button,.findbar button{border:1px solid #555;background:#3c4043;color:#fff;border-radius:7px;padding:7px 10px}.item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #3b3d40;cursor:pointer}.item:hover{background:#35363a}.item-main{flex:1;min-width:0}.item-title,.item-url{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.item-title{font-size:13px}.item-url{font-size:11px;color:#9aa0a6;margin-top:4px}.remove{border:0;background:transparent;color:#aaa;font-size:17px}.toast{position:fixed;right:16px;bottom:18px;background:#292a2d;border:1px solid #555;border-radius:10px;padding:12px 16px;z-index:20000;display:none;box-shadow:0 10px 30px #0008}.toast.show{display:block}.menu{position:fixed;right:12px;top:108px;width:240px;background:#292a2d;border:1px solid #4a4c50;border-radius:12px;padding:7px;display:none;z-index:11000;box-shadow:0 15px 45px #0008}.menu.open{display:block}.menu button{width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:10px 12px;border-radius:7px;cursor:pointer}.menu button:hover{background:#3c4043}.findbar{position:fixed;right:12px;top:108px;background:#292a2d;border:1px solid #555;border-radius:10px;padding:8px;z-index:12000;display:none}.findbar.open{display:flex;gap:5px}.findbar input{width:220px;background:#f1f3f4;border:0;border-radius:7px;padding:8px;outline:0}@media(max-width:700px){.logo{display:none}.tool{width:38px;height:38px}.toolbar{gap:5px;padding:8px}.address{height:38px;font-size:14px}.tab{min-width:120px}.panel{left:10px;right:10px;width:auto}}
</style></head>
<body>
<div class="tabs" id="tabs"><button class="new" id="newTab">+</button></div>
<div class="toolbar">
<img class="logo" src="logo.png" alt="YadavBrowser">
<button class="tool" id="back" title="Back">←</button><button class="tool" id="forward" title="Forward">→</button><button class="tool" id="reload" title="Reload">⟳</button><button class="tool" id="stop" title="Stop">×</button>
<input class="address" id="address" placeholder="Search or enter website" autocomplete="off" spellcheck="false">
<button class="tool" id="bookmark" title="Bookmark">☆</button><button class="tool" id="history" title="History">🕘</button><button class="tool" id="bookmarks" title="Bookmarks">🔖</button><button class="tool" id="private" title="New Private Tab">🕵️</button><button class="tool" id="aarya" title="Ask AARYA">🤖</button><button class="tool" id="more" title="Menu">⋮</button>
</div>
<div class="private-label" id="privateLabel">🕵️ Private browsing — history and bookmarks are disabled</div>
<div class="panel" id="historyPanel"><div class="panel-head"><strong>History</strong><button onclick="closePanels()">×</button></div><div class="panel-actions"><button id="clearHistory">Clear history</button></div><div id="historyList"></div></div>
<div class="panel" id="bookmarksPanel"><div class="panel-head"><strong>Bookmarks</strong><button onclick="closePanels()">×</button></div><div id="bookmarksList"></div></div>
<div class="panel" id="aaryaPanel"><div class="panel-head"><strong>🤖 AARYA</strong><button onclick="document.getElementById('aaryaPanel').classList.remove('open')">×</button></div><div id="aaryaMessages" style="padding:14px;max-height:390px;overflow:auto"><div class="item"><div class="item-main"><div class="item-title">Hi, I'm AARYA. Ask me anything.</div></div></div></div><div style="display:flex;gap:7px;padding:10px;border-top:1px solid #444"><input id="aaryaInput" class="address" style="height:38px" placeholder="Ask AARYA..."><button class="tool" id="aaryaSend">➤</button></div></div>
<div class="menu" id="menu"><button onclick="api('newTab')">New Tab</button><button onclick="api('newPrivateTab')">New Private Tab</button><button onclick="api('zoomIn')">Zoom In</button><button onclick="api('zoomOut')">Zoom Out</button><button onclick="api('zoomReset')">Reset Zoom</button><button onclick="api('find');openFind()">Find in Page</button><button onclick="api('print')">Print</button><button onclick="api('devtools')">Developer Tools</button><button onclick="api('fullscreen')">Fullscreen</button><button onclick="clearData()">Clear Browser Data</button></div>
<div class="findbar" id="findbar"><input id="findInput" placeholder="Find in page"><button onclick="api('find',document.getElementById('findInput').value)">Find</button><button onclick="api('findPrevious')">↑</button><button onclick="api('findNext')">↓</button><button onclick="document.getElementById('findbar').classList.remove('open')">×</button></div>
<div class="toast" id="toast"><b id="toastTitle">Download</b><div id="toastText">Starting...</div></div>
<script>
const $=id=>document.getElementById(id);const api=(m,arg)=>window.browserAPI?.[m]?.(arg);function closePanels(){['historyPanel','bookmarksPanel','aaryaPanel','menu','findbar'].forEach(id=>$(id).classList.remove('open'))}function openFind(){$('findbar').classList.add('open');$('findInput').focus()}
function navigate(){let v=$('address').value.trim();if(v)api('navigate',v)}$('address').addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});$('address').addEventListener('focus',()=>$('address').select());
$('back').onclick=()=>api('back');$('forward').onclick=()=>api('forward');$('reload').onclick=()=>api('reload');$('stop').onclick=()=>api('stop');$('newTab').onclick=()=>api('newTab');$('private').onclick=()=>api('newPrivateTab');$('bookmark').onclick=async()=>{let r=await api('toggleBookmark');if(r?.reason==='private-tab')return;updateBookmark()};$('history').onclick=async()=>{closePanels();renderHistory(await api('getHistory'));$('historyPanel').classList.add('open')};$('bookmarks').onclick=async()=>{closePanels();renderBookmarks(await api('getBookmarks'));$('bookmarksPanel').classList.add('open')};$('more').onclick=()=>{$('menu').classList.toggle('open')};$('clearHistory').onclick=async()=>{await api('clearHistory');renderHistory([])};
function updateBookmark(){api('getBookmarks').then(list=>{let found=list.some(x=>x.url===$('address').value);$('bookmark').textContent=found?'★':'☆'})}
function renderHistory(list){$('historyList').innerHTML='';if(!list.length){$('historyList').innerHTML='<div style="padding:30px;text-align:center;color:#9aa0a6">No browsing history.</div>';return}list.forEach(x=>{let r=document.createElement('div');r.className='item';r.innerHTML=`<div class="item-main"><div class="item-title"></div><div class="item-url"></div></div>`;r.querySelector('.item-title').textContent=x.title||x.url;r.querySelector('.item-url').textContent=x.url;r.onclick=()=>{api('navigate',x.url);closePanels()};$('historyList').appendChild(r)})}
function renderBookmarks(list){$('bookmarksList').innerHTML='';if(!list.length){$('bookmarksList').innerHTML='<div style="padding:30px;text-align:center;color:#9aa0a6">No bookmarks.</div>';return}list.forEach(x=>{let r=document.createElement('div');r.className='item';r.innerHTML=`<div class="item-main"><div class="item-title"></div><div class="item-url"></div></div><button class="remove">×</button>`;r.querySelector('.item-title').textContent=x.title||x.url;r.querySelector('.item-url').textContent=x.url;r.querySelector('.remove').onclick=async e=>{e.stopPropagation();await api('removeBookmark',x.url);renderBookmarks(await api('getBookmarks'));updateBookmark()};r.onclick=()=>{api('navigate',x.url);closePanels()};$('bookmarksList').appendChild(r)})}
function clearData(){if(confirm('Clear history, bookmarks and browser storage?'))api('clearBrowserData').then(closePanels)}
function openAarya(){closePanels();$('aaryaPanel').classList.add('open');$('aaryaInput').focus()}$('aarya').onclick=openAarya;$('aaryaSend').onclick=askAarya;$('aaryaInput').addEventListener('keydown',e=>{if(e.key==='Enter')askAarya()});async function askAarya(){let input=$('aaryaInput'),text=input.value.trim();if(!text)return;let u=document.createElement('div');u.className='item';u.style.justifyContent='flex-end';u.textContent=text;$('aaryaMessages').appendChild(u);input.value='';try{let r=await api('aaryaAsk',text);let b=document.createElement('div');b.className='item';b.textContent=r?.text||'No response';$('aaryaMessages').appendChild(b)}catch(e){let b=document.createElement('div');b.className='item';b.textContent='AARYA error: '+e.message;$('aaryaMessages').appendChild(b)}$('aaryaMessages').scrollTop=$('aaryaMessages').scrollHeight}
window.browserAPI.onTabUpdate(data=>{document.querySelectorAll('.tab').forEach(x=>x.remove());data.tabs.forEach((t,i)=>{let el=document.createElement('div');el.className='tab'+(i===data.activeIndex?' active':'')+(t.private?' private':'');let title=document.createElement('span');title.className='tab-title';title.textContent=(t.private?'🕵️ ':'')+(t.title||'New Tab');let c=document.createElement('span');c.className='tab-close';c.textContent='×';c.onclick=e=>{e.stopPropagation();api('switchTab',i);setTimeout(()=>api('closeTab'),0)};el.onclick=()=>api('switchTab',i);el.append(title,c);$('tabs').insertBefore(el,$('newTab'))});$('privateLabel').style.display=data.tabs[data.activeIndex]?.private?'block':'none'});window.browserAPI.onAddressUpdate(url=>{$('address').value=url||'';updateBookmark()});window.browserAPI.onFocusAddressBar(()=>{$('address').focus();$('address').select()});window.browserAPI.onBookmarkState(d=>{$('bookmark').textContent=d.bookmarked?'★':'☆';$('bookmark').title=d.private?'Bookmarks disabled in Private Tab':'Bookmark'});window.browserAPI.onHistoryUpdate(renderHistory);window.browserAPI.onBookmarksUpdate(renderBookmarks);window.browserAPI.onDownloadUpdate(d=>{$('toastTitle').textContent=d.filename||'Download';$('toastText').textContent=d.state==='completed'?'Download completed':d.state==='cancelled'?'Download cancelled':d.state==='interrupted'?'Download interrupted':'Downloading...';$('toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.remove('show'),4000)});window.browserAPI.onShowHistory(d=>{renderHistory(d);$('historyPanel').classList.add('open')});window.browserAPI.onShowBookmarks(d=>{renderBookmarks(d);$('bookmarksPanel').classList.add('open')});window.browserAPI.onOpenFind(openFind);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels();if(e.key==='F6'){e.preventDefault();$('address').focus()}});
</script></body></html>
