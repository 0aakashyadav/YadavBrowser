<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AARYA — YadavBrowser AI</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#f4f6f8;font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid #272b31;display:flex;align-items:center;padding:0 22px;gap:12px}.logo{width:38px;height:38px;border-radius:12px;background:#1c7cff;display:grid;place-items:center;font-weight:800}.brand{font-size:18px;font-weight:700}.brand small{display:block;color:#89919c;font-size:10px}.wrap{width:min(900px,calc(100% - 28px));margin:auto;display:flex;flex-direction:column;height:calc(100vh - 64px)}.hero{text-align:center;margin:auto auto 24px}.hero h1{font-size:46px;margin:0 0 8px}.hero p{color:#9aa3ad;margin:0}.chat{flex:1;overflow:auto;padding:24px 0}.msg{max-width:78%;padding:13px 16px;border-radius:16px;margin:12px 0;line-height:1.55;white-space:pre-wrap}.user{margin-left:auto;background:#1d6ee8}.assistant{background:#191d22;border:1px solid #292e35}.composer{border-top:1px solid #272b31;padding:16px 0 20px}.box{display:flex;gap:10px;background:#181b20;border:1px solid #343a42;border-radius:18px;padding:8px}.box textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:10px;font:inherit;min-height:44px}.box button{border:0;border-radius:13px;background:#2678ee;color:#fff;padding:0 18px;font-weight:700}.status{font-size:11px;color:#737c87;text-align:center;margin-top:8px}@media(max-width:600px){.hero h1{font-size:36px}.msg{max-width:90%}}</style></head><body><header class="top"><div class="logo">A</div><div class="brand">AARYA<small>YadavBrowser AI Assistant</small></div></header><main class="wrap"><section class="hero" id="hero"><h1>Ask AARYA</h1><p>Your AI assistant from YadavBrowser.</p></section><section class="chat" id="chat"></section><section class="composer"><div class="box"><textarea id="input" placeholder="Ask AARYA anything…" rows="1"></textarea><button id="send">Send</button></div><div class="status" id="status">Gemini-powered backend</div></section></main><script>const input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat'),hero=document.getElementById('hero'),status=document.getElementById('status');let messages=[];function add(role,text){hero.style.display='none';const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}async function ask(){const text=input.value.trim();if(!text)return;input.value='';add('user',text);send.disabled=true;status.textContent='AARYA is thinking…';const p=add('assistant','Thinking…');try{const r=await fetch('/api/aarya',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:[...messages,{role:'user',content:text}]})});const d=await r.json();if(!r.ok)throw Error(d.error||'AARYA unavailable');p.textContent=d.text||'No response.';messages.push({role:'user',content:text},{role:'assistant',content:d.text||''});status.textContent='AARYA ready'}catch(e){p.textContent='AARYA error: '+e.message;status.textContent='Backend unavailable'}finally{send.disabled=false;input.focus()}}send.onclick=ask;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}})</script></body></html>
